name: Deploy to GitHub Pages

# Manual only until the Vercel cutover. A push to main would publish this
# static build to GitHub Pages, where /api/lead and /api/subscribe 404.
# AFTER Vercel cert is valid for fflaccelerator.com: disable/delete this
# file and public/CNAME. See docs/vercel-cutover.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require LEAD_FORM_READ_TOKEN
        env:
          LEAD_FORM_READ_TOKEN: ${{ secrets.LEAD_FORM_READ_TOKEN }}
        run: |
          if [ -z "$LEAD_FORM_READ_TOKEN" ]; then
            echo "LEAD_FORM_READ_TOKEN is not set."
            echo "Add a repo secret: fine-grained PAT, Contents: Read on CoriolisAgency/lead-form only."
            exit 1
          fi
      - name: npm ci
        env:
          LEAD_FORM_READ_TOKEN: ${{ secrets.LEAD_FORM_READ_TOKEN }}
        run: |
          u="https://x-access-token:${LEAD_FORM_READ_TOKEN}@github.com/"
          git config --global --add url."$u".insteadOf https://github.com/
          git config --global --add url."$u".insteadOf ssh://git@github.com/
          npm ci
      - name: build
        run: npm run build
        env:
          ASTRO_BASE: /
          ASTRO_SITE: https://fflaccelerator.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
